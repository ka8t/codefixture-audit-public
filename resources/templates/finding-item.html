<div class="finding {{severity_class}} {{taint_class}}" id="{{finding_anchor}}" data-rule-key="{{rule_key}}" data-file="{{file}}" data-code-hash="{{code_hash}}">
    <div class="finding-header">
        <span class="finding-rule">{{rule}}</span>
        <button class="suppress-btn" onclick="toggleSuppression(this)" title="{{i18n_suppress_title}}">🚫</button>
        <span class="finding-category"><span class="category-icon">{{category_icon}}</span> {{category_name}}</span>
        <span class="finding-file">{{location}}</span>{{language_badge}}{{committer_display}}{{taint_badges}}
    </div>
    {{own_texts}}
    {{code_block}}
    {{fix_html}}
    {{taint_trace}}
</div>
