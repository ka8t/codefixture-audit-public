[package]
name = "codefixture-audit"
version = "0.1.0"
edition = "2024"
# Oldest Rust that builds this crate: edition 2024 needs 1.85, and the
# dependencies need up to 1.89 (`rusqlite`). Older Cargo, such as the 1.75 of
# Ubuntu's `cargo` package, stops on the edition before reading this field;
# the installation guides say so (ticket #265).
rust-version = "1.89"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
crc32fast = "1.4.2"
fancy-regex = "0.19.0"
# gzip of the advisory container, the version rules of a rule pack
# (ADR-0042, ADR-0043), pure Rust
# backend (miniz_oxide): no C library to build on Windows.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
postgres = "0.19.10"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shell-words = "1.1.0"
tree-sitter = "0.26.13"
tree-sitter-c-sharp = "0.23.5"
# No official crate under the `tree-sitter`/`tree-sitter-grammars` GitHub organization for
# Dockerfile (less standardized grammar, see ticket #69): a community fork,
# more active than the original `tree-sitter-dockerfile` crate (215K
# downloads, updated 2025-09 vs 22K/2024-05) — a decision settled with
# the maintainer rather than improvised, see the ticket.
tree-sitter-dockerfile-updated = "0.2.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-php = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
which = "8.0.0"
# The delivered binary: whole-program optimization across all crates
# (`lto = "fat"`, one codegen unit) for the regex and tree-sitter hot paths,
# and no symbol table (`strip`), which only debuggers read. `panic` stays
# `unwind`: `main.rs` catches a panic to print a readable error and exit
# with its own code instead of aborting.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# `build.rs` compiles `rules/builtin` into the encrypted catalog pack
# (ADR-0040) with the library's own `pack_format.rs`.
[build-dependencies]
chacha20poly1305 = "0.10.1"
serde_json = "1.0.151"
sha2 = "0.11.0"

# Ticket #281: the memory of the machine before a scan (`scan::memory`).
# Already in Cargo.lock as an indirect dependency. Outside every `private`
# block: the shared binary reads it too.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"
